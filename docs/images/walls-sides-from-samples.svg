<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Inter, system-ui, sans-serif">
<rect x="0" y="0" width="1000" height="620" rx="14" fill="#f8fafc"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><text x="30" y="32" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start" >From samples to one side: the cupboard in front of the wall</text><text x="30" y="52" font-size="13" fill="#64748b"  text-anchor="start" >The wall runs left to right, 2.75 m. The room is above, the way out is down. Each box is a 25 cm strip. (Real test case.)</text><g transform="translate(0,88)"><text x="30" y="0" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >1. Samples</text><text x="30" y="18" font-size="12" fill="#64748b"  text-anchor="start" >Each strip found a face: 4.0 for 4 strips, 3.7 for 3 strips, 4.0 for 4 strips.</text><rect x="151" y="68.99999999999999" width="65.5" height="14" fill="#4f46e5" stroke="#ffffff" stroke-width="1"   /><rect x="218.5" y="68.99999999999999" width="65.5" height="14" fill="#4f46e5" stroke="#ffffff" stroke-width="1"   /><rect x="286" y="68.99999999999999" width="65.5" height="14" fill="#4f46e5" stroke="#ffffff" stroke-width="1"   /><rect x="353.5" y="68.99999999999999" width="65.5" height="14" fill="#4f46e5" stroke="#ffffff" stroke-width="1"   /><rect x="421" y="39" width="65.5" height="14" fill="#f59e0b" stroke="#ffffff" stroke-width="1"   /><rect x="488.5" y="39" width="65.5" height="14" fill="#f59e0b" stroke="#ffffff" stroke-width="1"   /><rect x="556" y="39" width="65.5" height="14" fill="#f59e0b" stroke="#ffffff" stroke-width="1"   /><rect x="623.5" y="68.99999999999999" width="65.5" height="14" fill="#4f46e5" stroke="#ffffff" stroke-width="1"   /><rect x="691" y="68.99999999999999" width="65.5" height="14" fill="#4f46e5" stroke="#ffffff" stroke-width="1"   /><rect x="758.5" y="68.99999999999999" width="65.5" height="14" fill="#4f46e5" stroke="#ffffff" stroke-width="1"   /><rect x="826" y="68.99999999999999" width="65.5" height="14" fill="#4f46e5" stroke="#ffffff" stroke-width="1"   /><text x="140" y="79.99999999999999" font-size="11" fill="#64748b"  text-anchor="end" >face 4.0</text><text x="140" y="50" font-size="11" fill="#64748b"  text-anchor="end" >face 3.7</text></g><g transform="translate(0,208)"><text x="30" y="0" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >2 to 3. Split at jumps over 15 cm. No short piece, nothing to merge</text><text x="30" y="18" font-size="12" fill="#64748b"  text-anchor="start" >Three pieces: [0.00 to 1.00 at 4.0]   [1.00 to 1.75 at 3.7]   [1.75 to 2.75 at 4.0]</text><rect x="151" y="68.99999999999999" width="268" height="14" fill="#818cf8" stroke="#ffffff" stroke-width="1"   /><rect x="421" y="39" width="200.5" height="14" fill="#f59e0b" stroke="#ffffff" stroke-width="1"   /><rect x="623.5" y="68.99999999999999" width="268" height="14" fill="#34d399" stroke="#ffffff" stroke-width="1"   /></g><g transform="translate(0,328)"><text x="30" y="0" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >4. Bridge the dent</text><text x="30" y="18" font-size="12" fill="#64748b"  text-anchor="start" >The middle piece is 0.75 m long (at most 2.0 m) and 0.30 m inward (between 0.10 and 0.50): furniture. A neighbour grows over it.</text><rect x="151" y="68.99999999999999" width="470.5" height="14" fill="#818cf8" stroke="#ffffff" stroke-width="1"   /><rect x="623.5" y="68.99999999999999" width="268" height="14" fill="#34d399" stroke="#ffffff" stroke-width="1"   /><rect x="421" y="39" width="200.5" height="14" fill="none" stroke="#f59e0b" stroke-width="2"  stroke-dasharray="4 3" /><text x="521.25" y="32" font-size="11" fill="#b45309"  text-anchor="middle" >the cupboard no longer counts</text></g><g transform="translate(0,448)"><text x="30" y="0" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >5. Merge again: one side</text><text x="30" y="18" font-size="12" fill="#64748b"  text-anchor="start" >Faces 4.0 and 4.0 are within 10 cm: one side, face 4.0, from 0.00 to 2.75.</text><rect x="151" y="68.99999999999999" width="740.5" height="14" fill="#4f46e5" stroke="#ffffff" stroke-width="1"   /><text x="521.25" y="103.99999999999999" font-size="12" fill="#4f46e5" font-weight="600" text-anchor="middle" >side: face 4.0 m, from 0.00 m to 2.75 m</text></g><line x1="150" y1="568" x2="892.5" y2="568" stroke="#0f172a" stroke-width="1.5"  /><line x1="150" y1="568" x2="150" y2="573" stroke="#0f172a" stroke-width="1.5"  /><text x="150" y="586" font-size="11" fill="#64748b"  text-anchor="middle" >0.0 m</text><line x1="285" y1="568" x2="285" y2="573" stroke="#0f172a" stroke-width="1.5"  /><text x="285" y="586" font-size="11" fill="#64748b"  text-anchor="middle" >0.5 m</text><line x1="420" y1="568" x2="420" y2="573" stroke="#0f172a" stroke-width="1.5"  /><text x="420" y="586" font-size="11" fill="#64748b"  text-anchor="middle" >1.0 m</text><line x1="555" y1="568" x2="555" y2="573" stroke="#0f172a" stroke-width="1.5"  /><text x="555" y="586" font-size="11" fill="#64748b"  text-anchor="middle" >1.5 m</text><line x1="690" y1="568" x2="690" y2="573" stroke="#0f172a" stroke-width="1.5"  /><text x="690" y="586" font-size="11" fill="#64748b"  text-anchor="middle" >2.0 m</text><line x1="825" y1="568" x2="825" y2="573" stroke="#0f172a" stroke-width="1.5"  /><text x="825" y="586" font-size="11" fill="#64748b"  text-anchor="middle" >2.5 m</text><text x="30" y="586" font-size="11" fill="#64748b"  text-anchor="start" >along the wall</text><text x="30" y="610" font-size="11" fill="#64748b"  text-anchor="start" >Test “a short thing against the wall is covered by the wall and does not move it” (outline_steps_test.cpp).</text>
</svg>
