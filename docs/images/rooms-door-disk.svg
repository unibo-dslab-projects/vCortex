<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Inter, system-ui, sans-serif">
<rect x="0" y="0" width="1000" height="420" rx="14" fill="#f8fafc"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><text x="30" y="34" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start" >Why a door cuts a room and an aisle does not</text><text x="30" y="54" font-size="13" fill="#64748b"  text-anchor="start" >Top view. The round stamp has a radius of 0.5 m (door_radius): it needs 1.0 m of clear floor between tall cells.</text><g transform="translate(30,100)"><text x="0" y="0" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >a. Door of 0.9 m</text><text x="0" y="18" font-size="12" fill="#64748b"  text-anchor="start" >0.9 &lt; 1.0: the stamp does not fit: 2 rooms</text><rect x="0" y="40" width="280.5" height="161.5" fill="#eef2ff" stroke="none" stroke-width="1"   /><rect x="136.25" y="40" width="8" height="42.5" fill="#4f46e5" stroke="none" stroke-width="1"   /><rect x="136.25" y="159" width="8" height="42.5" fill="#4f46e5" stroke="none" stroke-width="1"   /><path d="M0 40 H280.5 V201.5 H0 Z" fill="none" stroke="#4f46e5" stroke-width="8"/><circle cx="140.25" cy="120.75" r="42.5" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/><line x1="140.25" y1="82.5" x2="140.25" y2="159" stroke="#f59e0b" stroke-width="3"  /><text x="187" y="124.75" font-size="11" fill="#b45309"  text-anchor="start" >door 0.9 m</text><text x="140.25" y="223.5" font-size="12" fill="#ef4444"  text-anchor="middle" >tall cells (wall) touch the stamp</text></g><g transform="translate(360,100)"><text x="0" y="0" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >b. Aisle of 0.8 m between desks</text><text x="0" y="18" font-size="12" fill="#64748b"  text-anchor="start" >desks are not tall: the stamp fits: 1 room</text><rect x="0" y="40" width="280.5" height="161.5" fill="#eef2ff" stroke="none" stroke-width="1"   /><path d="M0 40 H280.5 V201.5 H0 Z" fill="none" stroke="#4f46e5" stroke-width="8"/><rect x="106.25" y="44" width="68" height="46.75000000000001" fill="#d1fae5" stroke="#10b981" stroke-width="2"   /><rect x="106.25" y="150.75" width="68" height="46.75000000000001" fill="#d1fae5" stroke="#10b981" stroke-width="2"   /><circle cx="140.25" cy="120.75" r="42.5" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4"/><text x="140.25" y="124.75" font-size="11" fill="#047857"  text-anchor="middle" >1.0 m</text><text x="140.25" y="223.5" font-size="12" fill="#047857"  text-anchor="middle" >desk (green) is below 90 cm: not tall</text></g><g transform="translate(690,100)"><text x="0" y="0" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >c. Closet of 1.2 m, door of 0.8 m</text><text x="0" y="18" font-size="12" fill="#64748b"  text-anchor="start" >1.2 ≥ 1.0 so the closet opens its own room</text><rect x="0" y="40" width="170" height="161.5" fill="#eef2ff" stroke="none" stroke-width="1"   /><rect x="170" y="99.5" width="102" height="102" fill="#fef3c7" stroke="none" stroke-width="1"   /><path d="M0 40 H170 V99.5 H272 V201.5 H0 Z" fill="none" stroke="#4f46e5" stroke-width="8"/><rect x="166" y="99.5" width="8" height="17" fill="#4f46e5" stroke="none" stroke-width="1"   /><rect x="166" y="184.5" width="8" height="17" fill="#4f46e5" stroke="none" stroke-width="1"   /><circle cx="221" cy="150.5" r="42.5" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><circle cx="85" cy="120.75" r="42.5" fill="rgba(79,70,229,0.12)" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 4"/><text x="221" y="223.5" font-size="12" fill="#b45309"  text-anchor="middle" >closet</text><text x="161.5" y="154.5" font-size="11" fill="#b45309"  text-anchor="end" >0.8</text></g><text x="30" y="408" font-size="11" fill="#64748b"  text-anchor="start" >Based on three test drawings (free_space_test.cpp). In each, the poses decide where a room can open.</text>
</svg>
