<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1000" height="420" rx="14" fill="#f8fafc"/>

  <!-- building / level frame -->
  <rect x="30" y="30" width="620" height="360" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="8 6"/>
  <text x="46" y="54" font-size="13" fill="#64748b" font-weight="600">BUILDING · level 0</text>

  <!-- room fill -->
  <rect x="80" y="80" width="520" height="270" fill="#eef2ff"/>
  <text x="340" y="225" text-anchor="middle" font-size="18" fill="#4f46e5" font-weight="600">room</text>

  <!-- walls, with an opening on the bottom wall -->
  <path d="M80 80 H600 V350 H380 M300 350 H80 V80" fill="none" stroke="#4f46e5" stroke-width="10" stroke-linejoin="miter"/>
  <text x="340" y="70" text-anchor="middle" font-size="13" fill="#4f46e5" font-weight="600">wall</text>
  <text x="340" y="376" text-anchor="middle" font-size="13" fill="#b45309" font-weight="600">opening</text>
  <line x1="300" y1="350" x2="380" y2="350" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 4"/>

  <!-- objects -->
  <rect x="96" y="96" width="150" height="50" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
  <text x="171" y="126" text-anchor="middle" font-size="13" fill="#047857">object</text>
  <rect x="520" y="150" width="64" height="150" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
  <text x="552" y="230" text-anchor="middle" font-size="13" fill="#047857">object</text>
  <rect x="250" y="250" width="90" height="56" fill="#ffffff" stroke="#10b981" stroke-width="2.5" transform="rotate(-12 295 278)"/>
  <text x="295" y="282" text-anchor="middle" font-size="13" fill="#047857">object</text>

  <!-- survey path -->
  <path d="M340 400 C 340 330, 200 300, 200 220 S 380 120, 420 190" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="420" cy="190" r="7" fill="#475569"/>
  <text x="432" y="186" font-size="12" fill="#475569">path walked</text>

  <!-- legend -->
  <g font-size="14" fill="#0f172a">
    <text x="690" y="70" font-size="13" font-weight="600" fill="#64748b">WHAT A TWIN HOLDS</text>
    <rect x="690" y="95" width="26" height="8" fill="#4f46e5"/>
    <text x="728" y="104">Wall: a straight piece of wall</text>
    <rect x="690" y="130" width="26" height="18" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="728" y="144">Room: the floor space walls enclose</text>
    <rect x="690" y="170" width="26" height="18" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="728" y="184">Object: anything else, as a box</text>
    <line x1="690" y1="219" x2="716" y2="219" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="728" y="224">Opening: a gap in a wall</text>
    <line x1="690" y1="259" x2="716" y2="259" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="728" y="264">Path: where the robot walked</text>
    <rect x="690" y="290" width="26" height="18" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="728" y="304">Building and level: the whole</text>
  </g>
</svg>
