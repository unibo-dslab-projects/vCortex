<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Inter, system-ui, sans-serif">
<rect x="0" y="0" width="1000" height="400" rx="14" fill="#f8fafc"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><text x="30" y="32" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start" >Joining the corners: both sides must reach each other</text><text x="30" y="52" font-size="13" fill="#64748b"  text-anchor="start" >East side: face x = 4.0, seen from y = 0.3 to 2.7. North side: face y = 3.0, seen from x = 0.2 to 3.6. The room is below-left. (Real test cases.)</text><text x="30" y="80" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >a. Both stop short</text><text x="30" y="98" font-size="11" fill="#64748b"  text-anchor="start" >each stops short of the other's face</text><line x1="230" y1="295" x2="230" y2="175" stroke="#94a3b8" stroke-width="7"  /><line x1="40" y1="160" x2="210" y2="160" stroke="#94a3b8" stroke-width="7"  /><line x1="230" y1="295" x2="230" y2="160" stroke="#4f46e5" stroke-width="3"  /><line x1="40" y1="160" x2="230" y2="160" stroke="#047857" stroke-width="3"  /><circle cx="230" cy="160" r="8" fill="none" stroke="#ef4444" stroke-width="2" /><text x="242" y="227.5" font-size="11" fill="#4f46e5" font-weight="600" text-anchor="start" >east</text><text x="135" y="148" font-size="11" fill="#047857" font-weight="600" text-anchor="middle" >north</text><text x="30" y="332" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start" >east ends at y = 3.0, north at x = 4.0</text><text x="30" y="349" font-size="11" fill="#64748b"  text-anchor="start" >both gaps fit the limit (stretch up to 8 m)</text><text x="350" y="80" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >b. East side pokes past</text><text x="350" y="98" font-size="11" fill="#64748b"  text-anchor="start" >seen up to y = 3.4, which is 0.4 past the north face</text><line x1="550" y1="295" x2="550" y2="140" stroke="#94a3b8" stroke-width="7"  /><line x1="360" y1="160" x2="530" y2="160" stroke="#94a3b8" stroke-width="7"  /><line x1="550" y1="295" x2="550" y2="160" stroke="#4f46e5" stroke-width="3"  /><line x1="360" y1="160" x2="550" y2="160" stroke="#047857" stroke-width="3"  /><circle cx="550" cy="160" r="8" fill="none" stroke="#ef4444" stroke-width="2" /><text x="562" y="227.5" font-size="11" fill="#4f46e5" font-weight="600" text-anchor="start" >east</text><text x="455" y="148" font-size="11" fill="#047857" font-weight="600" text-anchor="middle" >north</text><text x="350" y="332" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start" >trimmed back to y = 3.0</text><text x="350" y="349" font-size="11" fill="#64748b"  text-anchor="start" >0.4 past is under corner_overshoot = 0.5</text><text x="670" y="80" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >c. A T, not a corner</text><text x="670" y="98" font-size="11" fill="#64748b"  text-anchor="start" >the north wall runs on to x = 6.0</text><line x1="870" y1="295" x2="870" y2="225" stroke="#94a3b8" stroke-width="7"  /><line x1="680" y1="160" x2="970" y2="160" stroke="#94a3b8" stroke-width="7"  /><line x1="870" y1="295" x2="870" y2="225" stroke="#4f46e5" stroke-width="3"  /><line x1="680" y1="160" x2="970" y2="160" stroke="#047857" stroke-width="3"  /><text x="882" y="260" font-size="11" fill="#4f46e5" font-weight="600" text-anchor="start" >east</text><text x="825" y="148" font-size="11" fill="#047857" font-weight="600" text-anchor="middle" >north</text><text x="670" y="332" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start" >east stays at y = 1.7</text><text x="670" y="349" font-size="11" fill="#64748b"  text-anchor="start" >north is 2.0 past the east face: over the 0.5 limit</text><rect x="30" y="366" width="22" height="7" fill="#94a3b8" stroke="none" stroke-width="1"   /><text x="58" y="373" font-size="11" fill="#475569"  text-anchor="start" >as seen</text><rect x="130" y="366" width="22" height="4" fill="#4f46e5" stroke="none" stroke-width="1"   /><text x="158" y="373" font-size="11" fill="#475569"  text-anchor="start" >after the join</text><circle cx="260" cy="369" r="7" fill="none" stroke="#ef4444" stroke-width="2" /><text x="274" y="373" font-size="11" fill="#475569"  text-anchor="start" >corner</text><text x="30" y="392" font-size="11" fill="#64748b"  text-anchor="start" >Tests in outline_steps_test.cpp: “stretched to meet”, “trimmed back”, “not its corner”.</text>
</svg>
