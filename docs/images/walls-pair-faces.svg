<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="Inter, system-ui, sans-serif">
<rect x="0" y="0" width="1000" height="450" rx="14" fill="#f8fafc"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><text x="30" y="32" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start" >Stage B: faces become walls</text><text x="30" y="52" font-size="13" fill="#64748b"  text-anchor="start" >Top view of a short piece of wall, 3 m long along y. Faces are in metres on the x axis. (Real tests for a and b.)</text><text x="40" y="70" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >a. Two faces, two rooms</text><text x="40" y="88" font-size="11" fill="#64748b"  text-anchor="start" >faces 1.70 (left room) and 1.82 (right room): 0.12 apart, 5 to 35 cm</text><rect x="40" y="110" width="132" height="132" fill="#eef2ff" stroke="none" stroke-width="1"   /><rect x="203.68000000000004" y="110" width="136.31999999999996" height="132" fill="#d1fae5" stroke="none" stroke-width="1"   /><rect x="172" y="110" width="31.680000000000035" height="132" fill="#4f46e5" stroke="none" stroke-width="1"   opacity="0.85"/><line x1="187.84000000000003" y1="104" x2="187.84000000000003" y2="248" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" /><text x="172" y="266" font-size="11" fill="#475569"  text-anchor="end" >1.70</text><text x="203.68000000000004" y="266" font-size="11" fill="#475569"  text-anchor="start" >1.82</text><text x="180" y="290" font-size="12" fill="#4f46e5" font-weight="600" text-anchor="middle" >wall: centre 1.76, thickness 0.12</text><text x="70" y="130" font-size="11" fill="#475569"  text-anchor="start" >left room</text><text x="270" y="130" font-size="11" fill="#475569"  text-anchor="middle" >right room</text><text x="380" y="70" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >b. One face only</text><text x="380" y="88" font-size="11" fill="#64748b"  text-anchor="start" >a wall seen from one room: thickness = walls.thickness (0.10)</text><rect x="380" y="110" width="132" height="132" fill="#eef2ff" stroke="none" stroke-width="1"   /><rect x="512" y="110" width="26.40000000000009" height="132" fill="#4f46e5" stroke="none" stroke-width="1"   opacity="0.85"/><rect x="538.4000000000001" y="110" width="141.5999999999999" height="132" fill="#f1f5f9" stroke="none" stroke-width="1"   /><line x1="525.2" y1="104" x2="525.2" y2="248" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" /><text x="512" y="266" font-size="11" fill="#475569"  text-anchor="end" >face 1.70</text><text x="520" y="290" font-size="12" fill="#4f46e5" font-weight="600" text-anchor="middle" >wall: centre 1.75, thickness 0.10</text><text x="630" y="176" font-size="11" fill="#64748b"  text-anchor="middle" >behind the wall:</text><text x="630" y="190" font-size="11" fill="#64748b"  text-anchor="middle" >never seen</text><text x="720" y="70" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" >c. Pieces on one line</text><text x="720" y="88" font-size="11" fill="#64748b"  text-anchor="start" >gap up to min_gap = 0.30 m is closed (made-up numbers)</text><rect x="720" y="110" width="14" height="52" fill="#4f46e5" stroke="none" stroke-width="1"   /><rect x="720" y="167.2" width="14" height="46.8" fill="#4f46e5" stroke="none" stroke-width="1"   /><rect x="720" y="162" width="14" height="5.2" fill="#f59e0b" stroke="none" stroke-width="1"   /><text x="744" y="165" font-size="11" fill="#b45309"  text-anchor="start" >gap 0.2 closed → one wall</text><text x="744" y="136" font-size="11" fill="#475569"  text-anchor="start" >0 to 2.0</text><text x="744" y="190.60000000000002" font-size="11" fill="#475569"  text-anchor="start" >2.2 to 4.0</text><rect x="870" y="110" width="14" height="52" fill="#4f46e5" stroke="none" stroke-width="1"   /><rect x="870" y="185.4" width="14" height="46.800000000000004" fill="#4f46e5" stroke="none" stroke-width="1"   /><line x1="877" y1="164" x2="877" y2="185.4" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" /><text x="894" y="176" font-size="11" fill="#ef4444"  text-anchor="start" >gap 0.9 stays</text><text x="894" y="190" font-size="11" fill="#ef4444"  text-anchor="start" >open: a door</text><text x="720" y="258.4" font-size="11" fill="#475569"  text-anchor="start" >centre = average weighted by length:</text><text x="720" y="274.4" font-size="11" fill="#475569" font-weight="600" text-anchor="start" >(3.00×2.0 + 3.02×1.8) ÷ 3.8 = 3.009</text><text x="30" y="436" font-size="11" fill="#64748b"  text-anchor="start" >Corner snapping then moves the ends of each wall to the centre line of the perpendicular wall within 0.5 m (step B3).</text>
</svg>
