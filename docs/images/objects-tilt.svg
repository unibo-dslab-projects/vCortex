<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Inter, system-ui, sans-serif">
<rect x="0" y="0" width="1000" height="470" rx="14" fill="#f8fafc"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><text x="30" y="32" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start" >Why an object’s bottom looks too high: the floor is tilted</text><text x="30" y="52" font-size="13" fill="#64748b"  text-anchor="start" >Side view of the real room, object-1. The vertical scale is 1.6× the horizontal one, so the tilt looks bigger than it is. The numbers are real.</text><line x1="60" y1="327.8933333333333" x2="940" y2="270.4" stroke="#0f172a" stroke-width="3"  /><text x="70" y="349.8933333333333" font-size="12" fill="#0f172a"  text-anchor="start" >floor plane (tilt 2.4°)</text><line x1="120" y1="290" x2="940" y2="290" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" /><text x="652" y="312" font-size="12" fill="#475569"  text-anchor="start" >floor_z = −0.455: the floor under the middle of the walls</text><circle cx="640" cy="290" r="6" fill="#0f172a" stroke="none" stroke-width="1" /><rect x="245" y="116" width="70" height="150" fill="#d1fae5" stroke="#10b981" stroke-width="2"   /><text x="280" y="148" font-size="12" fill="#047857" font-weight="600" text-anchor="middle" >object-1</text><text x="280" y="166" font-size="11" fill="#047857"  text-anchor="middle" >(top 1.217)</text><text x="235" y="260" font-size="12" fill="#047857" font-weight="600" text-anchor="end" >bottom_z = −0.305</text><line x1="220" y1="290" x2="220" y2="266" stroke="#ef4444" stroke-width="2"  marker-end="url(#ar)"/><text x="210" y="282" font-size="11" fill="#ef4444" font-weight="600" text-anchor="end" >0.15 m: what bottom_z − floor_z says</text><line x1="345" y1="313.52" x2="345" y2="266" stroke="#4f46e5" stroke-width="2"  marker-end="url(#ar)"/><text x="355" y="258" font-size="11" fill="#4f46e5" font-weight="600" text-anchor="start" >at least 0.30 m above the local floor: the band starts here</text><text x="280" y="337.52" font-size="11" fill="#475569"  text-anchor="middle" >the floor here is 0.15 m lower than floor_z</text><line x1="280" y1="374" x2="640" y2="374" stroke="#475569" stroke-width="1.5"  /><line x1="280" y1="368" x2="280" y2="380" stroke="#475569" stroke-width="1.5"  /><line x1="640" y1="368" x2="640" y2="380" stroke="#475569" stroke-width="1.5"  /><text x="460" y="396" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" >3.6 m from the middle × 0.041 (the slope) = 0.15 m</text><text x="30" y="436" font-size="12" fill="#475569"  text-anchor="start" >Rule of thumb: the floor changes by about 4 cm for each metre away from the middle of the walls.</text><text x="30" y="456" font-size="11" fill="#64748b"  text-anchor="start" >bottom_z and top_z_seen are heights in the map. Subtracting floor_z is exact only at the middle of the walls.</text>
</svg>
