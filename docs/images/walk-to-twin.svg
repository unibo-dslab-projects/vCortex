<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#6366f1" opacity="0.55"/>
      <circle cx="6.5" cy="6" r="1" fill="#6366f1" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- panel 1: the walk -->
  <rect x="20" y="20" width="260" height="210" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="50" y="50" width="200" height="150" fill="#ffffff" stroke="#334155" stroke-width="5"/>
  <rect x="62" y="62" width="70" height="28" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="170" y="140" width="60" height="45" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="110" y="120" width="34" height="34" fill="#e2e8f0" stroke="#94a3b8"/>
  <path d="M75 180 C 100 110, 160 100, 160 120 S 220 90, 225 70" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6 5"/>
  <g transform="translate(225 70)">
    <rect x="-11" y="-7" width="22" height="14" rx="4" fill="#4f46e5"/>
    <circle cx="13" cy="0" r="5" fill="#4f46e5"/>
    <circle cx="13" cy="0" r="22" fill="none" stroke="#4f46e5" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <text x="150" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">1. Walk the robot</text>
  <text x="150" y="284" text-anchor="middle" font-size="13" fill="#64748b">its lidar measures the room</text>

  <line x1="290" y1="125" x2="340" y2="125" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- panel 2: the point cloud -->
  <rect x="350" y="20" width="260" height="210" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <g>
    <rect x="378" y="48" width="204" height="10" fill="url(#dots)"/>
    <rect x="378" y="192" width="204" height="10" fill="url(#dots)"/>
    <rect x="378" y="48" width="10" height="154" fill="url(#dots)"/>
    <rect x="572" y="48" width="10" height="154" fill="url(#dots)"/>
    <rect x="392" y="62" width="70" height="28" fill="url(#dots)"/>
    <rect x="500" y="140" width="60" height="45" fill="url(#dots)"/>
    <rect x="440" y="120" width="34" height="34" fill="url(#dots)"/>
    <rect x="420" y="100" width="12" height="40" fill="url(#dots)" opacity="0.6"/>
    <circle cx="530" cy="95" r="2" fill="#6366f1" opacity="0.5"/>
    <circle cx="410" cy="170" r="2" fill="#6366f1" opacity="0.5"/>
    <circle cx="595" cy="120" r="2" fill="#6366f1" opacity="0.5"/>
  </g>
  <text x="480" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">2. A cloud of points</text>
  <text x="480" y="284" text-anchor="middle" font-size="13" fill="#64748b">millions of dots, no meaning yet</text>

  <line x1="620" y1="125" x2="670" y2="125" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- panel 3: the twin -->
  <rect x="680" y="20" width="260" height="210" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="710" y="50" width="200" height="150" fill="#eef2ff" stroke="#4f46e5" stroke-width="6"/>
  <rect x="722" y="62" width="70" height="28" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <rect x="830" y="140" width="60" height="45" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <rect x="770" y="120" width="34" height="34" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="810" y="44" text-anchor="middle" font-size="11" fill="#4f46e5" font-weight="600">wall</text>
  <text x="757" y="80" text-anchor="middle" font-size="11" fill="#047857">object</text>
  <text x="840" y="110" text-anchor="middle" font-size="11" fill="#4f46e5">room</text>
  <text x="810" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">3. A digital twin</text>
  <text x="810" y="284" text-anchor="middle" font-size="13" fill="#64748b">walls, rooms and objects</text>
</svg>
